<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyền Hình Trực Tuyến & Lịch Phát Sóng</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3075/3075908.png">
    
    <!-- Thư viện Video.js chuyên dụng cho Live Stream (Sửa lỗi 0:00/0:34 & Lỗi mất hình TV) -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER VỚI LOGO TRUYỀN HÌNH -->
    <header>
        <div class="header-logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3075/3075908.png" alt="Logo Web" class="site-logo">
            <span class="header-title">TRUYỀN HÌNH TRỰC TUYẾN</span>
        </div>
    </header>

    <div class="container">
        <!-- KHUNG PHÁT VIDEO -->
        <div class="player-container">
            <div class="video-wrapper">
                <video 
                    id="main-player" 
                    class="video-js vjs-default-skin vjs-big-play-centered 16-9" 
                    controls 
                    preload="auto" 
                    playsinline 
                    webkit-playsinline>
                </video>
            </div>
            
            <div class="now-playing">
                <span id="current-channel-name">Vui lòng chọn kênh để xem</span>
            </div>

            <!-- BẢNG LỊCH PHÁT SÓNG THẬT (EPG API) -->
            <div class="epg-box">
                <h3>📅 Lịch phát sóng hôm nay</h3>
                <div id="epg-list" class="epg-list">
                    <p class="epg-loading">Hãy chọn kênh để xem lịch phát sóng...</p>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH KÊNH (ĐÃ XÓA CHỮ NHÀ ĐÀI - CHỈ GIỮ LOGO LỚN) -->
        <div class="sidebar">
            
            <!-- NHÓM VTV: CHỈ CÓ LOGO -->
            <div class="group-title-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/VTV_Logo.svg/1200px-VTV_Logo.svg.png" alt="VTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('VTV1', 'https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8', 'vtv1')">VTV1</button>
                <button class="channel-btn" onclick="playChannel('VTV2', 'https://live.fptplay53.net/live/media/vtv2/live247-hls-avc/index.m3u8', 'vtv2')">VTV2</button>
                <button class="channel-btn" onclick="playChannel('VTV3', 'https://live.fptplay53.net/live/media/vtv3/live247-hls-avc/index.m3u8', 'vtv3')">VTV3</button>
                <button class="channel-btn" onclick="playChannel('VTV4', 'https://live.fptplay53.net/live/media/vtv4/live247-hls-avc/index.m3u8', 'vtv4')">VTV4</button>
                <button class="channel-btn" onclick="playChannel('VTV5', 'https://live.fptplay53.net/live/media/vtv5/live247-hls-avc/index.m3u8', 'vtv5')">VTV5</button>
                <button class="channel-btn" onclick="playChannel('VTV6', 'https://live.fptplay53.net/live/media/vtv6/live247-hls-avc/index.m3u8', 'vtv6')">VTV6</button>
                <button class="channel-btn" onclick="playChannel('VTV7', 'https://live.fptplay53.net/live/media/vtv7/live247-hls-avc/index.m3u8', 'vtv7')">VTV7</button>
                <button class="channel-btn" onclick="playChannel('VTV8', 'https://live.fptplay53.net/live/media/vtv8/live-hls-avc/index.m3u8', 'vtv8')">VTV8</button>
                <button class="channel-btn" onclick="playChannel('VTV9', 'https://live.fptplay53.net/live/media/vtv9/live247-hls-avc/index.m3u8', 'vtv9')">VTV9</button>
                <button class="channel-btn" onclick="playChannel('VTV10', 'https://live.fptplay53.net/live/media/vtv10/live247-hls-avc/index.m3u8', 'vtv10')">VTV10</button>
            </div>

            <!-- NHÓM SCTV: CHỈ CÓ LOGO -->
            <div class="group-title-logo">
                <img src="https://i.imgur.com/kOyPmAu.png" alt="SCTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn sports" onclick="playChannel('SCTV 15 (Sports)', 'https://live.fptplay53.net/epzhd1/sctv15hd_vhls.smil/chunklist.m3u8', 'sctv15')">SCTV 15</button>
                <button class="channel-btn sports" onclick="playChannel('SCTV 17 (Sports)', 'https://live.fptplay53.net/epzhd1/sctv17hd_vhls.smil/chunklist.m3u8', 'sctv17')">SCTV 17</button>
                <button class="channel-btn sports" onclick="playChannel('SCTV 22 (Sports)', 'https://live.fptplay53.net/epzhd1/sctv22hd_vhls.smil/chunklist.m3u8', 'sctv22')">SCTV 22</button>
            </div>

            <!-- NHÓM THVL: CHỈ CÓ LOGO -->
            <div class="group-title-logo">
                <img src="https://i.imgur.com/pTVybK6.png" alt="THVL" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn thvl" onclick="playChannel('THVL 1', 'https://live.fptplay53.net/live/media/vinhlong1/live247-hls-avc/index.m3u8', 'thvl1')">THVL 1</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 2', 'https://live.fptplay53.net/live/media/vinhlong2/live247-hls-avc/index.m3u8', 'thvl2')">THVL 2</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 3', 'https://live.fptplay53.net/live/media/vinhlong3/live247-hls-avc/index.m3u8', 'thvl3')">THVL 3</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 4', 'https://live.fptplay53.net/epzhd2/vinhlong4hd_vhls.smil/chunklist.m3u8', 'thvl4')">THVL 4</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 5', 'https://live.fptplay53.net/epzsd1/vinhlong5_vhls.smil/chunklist.m3u8', 'thvl5')">THVL 5</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
