<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUTDIEMTV - Xem Trực Tiếp Đài Truyền Hình Mỗi Ngày</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện Hls.js hỗ trợ phát luồng m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header>
      <link rel="icon" type="image/dutdiemtv" href="dutdiemtv.png">
      <h1>DUTDIEMTV</h1>
    </header>

    <div class="container">
        <!-- Khung phát Video -->
        <div class="player-container">
            <video id="video-player" controls autoplay poster="https://via.placeholder.com/800x450?text=Ch%E1%BB%8Dn+K%C3%AAnh+%C4%90%E1%BB%83+Xem"></video>
            <div class="now-playing">
                <span id="current-channel-name">Vui lòng chọn kênh để xem</span>
            </div>
        </div>

        <!-- Danh sách kênh -->
        <div class="sidebar">
            
            <!-- NHÓM VTV -->
            <div class="group-title">Đài Truyền Hình Việt Nam (VTV)</div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('VTV1', 'https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8')">VTV1</button>
                <button class="channel-btn" onclick="playChannel('VTV2', 'https://live.fptplay53.net/live/media/vtv2/live247-hls-avc/index.m3u8')">VTV2</button>
                <button class="channel-btn" onclick="playChannel('VTV3', 'https://live.fptplay53.net/live/media/vtv3/live247-hls-avc/index.m3u8')">VTV3</button>
                <button class="channel-btn" onclick="playChannel('VTV4', 'https://live.fptplay53.net/live/media/vtv4/live247-hls-avc/index.m3u8')">VTV4</button>
                <button class="channel-btn" onclick="playChannel('VTV5', 'https://live.fptplay53.net/live/media/vtv5/live247-hls-avc/index.m3u8')">VTV5</button>
                <button class="channel-btn" onclick="playChannel('VTV6', 'https://live.fptplay53.net/live/media/vtv6/live247-hls-avc/index.m3u8')">VTV6</button>
                <button class="channel-btn" onclick="playChannel('VTV7', 'https://live.fptplay53.net/live/media/vtv7/live247-hls-avc/index.m3u8')">VTV7</button>
                <button class="channel-btn" onclick="playChannel('VTV8', 'https://live.fptplay53.net/live/media/vtv8/live-hls-avc/index.m3u8')">VTV8</button>
                <button class="channel-btn" onclick="playChannel('VTV9', 'https://live.fptplay53.net/live/media/vtv9/live247-hls-avc/index.m3u8')">VTV9</button>
                <button class="channel-btn" onclick="playChannel('VTV10', 'https://live.fptplay53.net/live/media/vtv10/live247-hls-avc/index.m3u8')">VTV10</button>
            </div>

            <!-- NHÓM SCTV SPORTS -->
            <div class="group-title">Kênh Thể Thao SCTV (Sports)</div>
            <div class="channel-grid">
                <button class="channel-btn sports" onclick="playChannel('SCTV 15 (Sports)', 'https://hoiquan.dpdns.org/VTVGo/?sctv15')">SCTV 15</button>
                <button class="channel-btn sports" onclick="playChannel('SCTV 17 (Sports)', 'https://hoiquan.dpdns.org/VTVGo/?sctv17')">SCTV 17</button>
                <button class="channel-btn sports" onclick="playChannel('SCTV 22 (Sports)', 'https://hoiquan.dpdns.org/VTVGo/?sctv22')">SCTV 22</button>
            </div>

            <!-- NHÓM THVL -->
            <div class="group-title">Đài Truyền Hình Vĩnh Long (THVL)</div>
            <div class="channel-grid">
                <button class="channel-btn thvl" onclick="playChannel('THVL 1', 'https://live.fptplay53.net/live/media/vinhlong1/live247-hls-avc/index.m3u8')">THVL 1</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 2', 'https://live.fptplay53.net/live/media/vinhlong2/live247-hls-avc/index.m3u8')">THVL 2</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 3', 'https://live.fptplay53.net/live/media/vinhlong3/live247-hls-avc/index.m3u8')">THVL 3</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 4', 'https://live.fptplay53.net/epzhd2/vinhlong4hd_vhls.smil/chunklist.m3u8')">THVL 4</button>
                <button class="channel-btn thvl" onclick="playChannel('THVL 5', 'https://live.fptplay53.net/epzsd1/vinhlong5_vhls.smil/chunklist.m3u8')">THVL 5</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
