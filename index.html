<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyền Hình Trực Tuyến & Lịch Phát Sóng</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3075/3075908.png">
    
    <!-- Video.js Player -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3075/3075908.png" alt="Logo Web" class="site-logo">
            <span class="header-title">TRUYỀN HÌNH TRỰC TUYẾN</span>
        </div>
    </header>

    <div class="container">
        <!-- KHUNG PHÁT VIDEO -->
        <div class="player-container">
            <div class="video-wrapper">
                <video 
                    id="main-player" 
                    class="video-js vjs-default-skin vjs-big-play-centered 16-9" 
                    controls 
                    preload="auto" 
                    playsinline 
                    webkit-playsinline>
                </video>
            </div>
            
            <div class="now-playing">
                <span id="current-channel-name">Vui lòng chọn kênh để xem</span>
            </div>

            <!-- BẢNG LỊCH PHÁT SÓNG THẬT (EPG) -->
            <div class="epg-box">
                <h3>📅 Lịch phát sóng hôm nay</h3>
                <div id="epg-list" class="epg-list">
                    <p class="epg-loading">Hãy chọn kênh để xem lịch phát sóng...</p>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH KÊNH (THAY THẾ CHỮ BẰNG LOGO KÊNH) -->
        <div class="sidebar">
            
            <!-- NHÓM VTV -->
            <div class="group-title-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/VTV_Logo.svg/1200px-VTV_Logo.svg.png" alt="VTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('VTV1', 'https://vtv1-hlsv4.vtv.vn/vtv1.m3u8', 'vtv1')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/22/VTV1_logo_2013_final.png" alt="VTV1">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV2', 'https://vtv2-hlsv4.vtv.vn/vtv2.m3u8', 'vtv2')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/VTV2_HD_logo_2022.svg/1200px-VTV2_HD_logo_2022.svg.png" alt="VTV2">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV3', 'https://vtv3-hlsv4.vtv.vn/vtv3.m3u8', 'vtv3')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/VTV3_logo_2013.svg/1200px-VTV3_logo_2013.svg.png" alt="VTV3">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV4', 'https://vtv4-hlsv4.vtv.vn/vtv4.m3u8', 'vtv4')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/VTV4_logo_2013.png/1200px-VTV4_logo_2013.png" alt="VTV4">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5', 'https://vtv5-hlsv4.vtv.vn/vtv5.m3u8', 'vtv5')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/VTV5_logo_2013.svg/1200px-VTV5_logo_2013.svg.png" alt="VTV5">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5 Tây Nam Bộ', 'https://vtv5tnb-hlsv4.vtv.vn/vtv5tnb.m3u8', 'vtv5tnb')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/VTV5_logo_2013.svg/1200px-VTV5_logo_2013.svg.png" alt="VTV5 TNB">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5 Tây Nguyên', 'https://vtv5tn-hlsv4.vtv.vn/vtv5tn.m3u8', 'vtv5tn')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/VTV5_logo_2013.svg/1200px-VTV5_logo_2013.svg.png" alt="VTV5 TN">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV7', 'https://vtv7-hlsv4.vtv.vn/vtv7.m3u8', 'vtv7')">

                </button>
                <button class="channel-btn" onclick="playChannel('VTV8', 'https://vtv8-hlsv4.vtv.vn/vtv8.m3u8', 'vtv8')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/VTV8_logo.svg/1200px-VTV8_logo.svg.png" alt="VTV8">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV9', 'https://vtv9-hlsv4.vtv.vn/vtv9.m3u8', 'vtv9')">

                </button>
            </div>

            <!-- NHÓM HTV -->
            <div class="group-title-logo">

            <div class="channel-grid">

                <button class="channel-btn" onclick="playChannel('HTV3', 'https://liveh12byt.vtvprime.vn/hls/HTV3/03.m3u8', 'htv3')">

                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/HTV4_logo_2016.svg/1200px-HTV4_logo_2016.svg.png" alt="HTV4">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV7', 'https://liveh12byt.vtvprime.vn/hls/HTV7/03.m3u8', 'htv7')">

                </button>
            </div>

            <!-- NHÓM ON SPORTS / VTVcab -->
            <div class="group-title-logo">
                <img src="https://i.imgur.com/3pXn3Jm.png" alt="ON Sports" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('ON Sports', 'https://liveh12byt.vtvprime.vn/hls/ONSPORTS/03.m3u8', 'onsports')">

                <button class="channel-btn" onclick="playChannel('ON Football', 'https://liveh12byt.vtvprime.vn/hls/ONFOOTBALL/03.m3u8', 'onfootball')">
                    <img src="https://i.imgur.com/3pXn3Jm.png" alt="ON Football">
                </button>
                <button class="channel-btn" onclick="playChannel('ON Sports News', 'https://liveh12byt.vtvprime.vn/hls/ONSPORTSNEWS/03.m3u8', 'onsportsnews')">
                    <img src="https://i.imgur.com/3pXn3Jm.png" alt="ON Sports News">
                </button>
            </div>

            <!-- NHÓM SCTV -->
            <div class="group-title-logo">
                <img src="https://i.imgur.com/kOyPmAu.png" alt="SCTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('SCTV 15 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV15/03.m3u8', 'sctv15')">
                    <img src="https://i.imgur.com/kOyPmAu.png" alt="SCTV 15">
                </button>
                <button class="channel-btn" onclick="playChannel('SCTV 17 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV17/03.m3u8', 'sctv17')">
                    <img src="https://i.imgur.com/kOyPmAu.png" alt="SCTV 17">
                </button>
                <button class="channel-btn" onclick="playChannel('SCTV 22 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV22/03.m3u8', 'sctv22')">
                    <img src="https://i.imgur.com/kOyPmAu.png" alt="SCTV 22">
                </button>
            </div>

            <!-- NHÓM THVL -->
            <div class="group-title-logo">
                <img src="https://i.imgur.com/pTVybK6.png" alt="THVL" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('THVL 1', 'https://liveh12byt.vtvprime.vn/hls/THVL1/03.m3u8', 'thvl1')">
                    <img src="https://i.imgur.com/pTVybK6.png" alt="THVL 1">
                </button>
                <button class="channel-btn" onclick="playChannel('THVL 2', 'https://liveh12byt.vtvprime.vn/hls/THVL2/03.m3u8', 'thvl2')">

                </button>
                <button class="channel-btn" onclick="playChannel('THVL 3', 'https://liveh12byt.vtvprime.vn/hls/THVL3/03.m3u8', 'thvl3')">

                </button>
                <button class="channel-btn" onclick="playChannel('THVL 4', 'https://liveh12byt.vtvprime.vn/hls/THVL4/03.m3u8', 'thvl4')">

    <script src="script.js"></script>

</html>
