<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUTDIEMTV</title>
    <!-- Favicon từ thư mục images -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <!-- Video.js Player -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER: ĐÃ XÓA CHỮ, CHỈ CÓ LOGO DUTDIEMTV -->
    <header>
        <div class="header-logo-container">
            <img src="images/dutdiemtv-logo.png" alt="DUTDIEMTV" class="site-logo">
        </div>
    </header>

    <div class="container">
        <!-- KHUNG PHÁT VIDEO -->
        <div class="player-container">
            <div class="video-wrapper" id="video-wrapper">
                <video 
                    id="main-player" 
                    class="video-js vjs-default-skin vjs-big-play-centered 16-9" 
                    controls 
                    preload="auto" 
                    playsinline 
                    webkit-playsinline>
                </video>
            </div>
            
            <div class="now-playing">
                <span id="current-channel-name">Vui lòng chọn kênh bên phải để xem</span>
            </div>

            <!-- BẢNG LỊCH PHÁT SÓNG THẬT (EPG) -->
            <div class="epg-box">
                <h3>📅 Lịch phát sóng hôm nay</h3>
                <div id="epg-list" class="epg-list">
                    <p class="epg-loading">Hãy chọn kênh để xem lịch phát sóng...</p>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH KÊNH (TẤT CẢ LOGO ĐỀU DÙNG images/???.png) -->
        <div class="sidebar">
            
            <!-- NHÓM VTV -->
            <div class="group-title-logo">
                <img src="images/vtv.png" alt="VTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('VTV1', 'https://vtv1-hlsv4.vtv.vn/vtv1.m3u8', 'vtv1')">
                    <img src="images/vtv1.png" alt="VTV1">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV2', 'https://vtv2-hlsv4.vtv.vn/vtv2.m3u8', 'vtv2')">
                    <img src="images/vtv2.png" alt="VTV2">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV3', 'https://vtv3-hlsv4.vtv.vn/vtv3.m3u8', 'vtv3')">
                    <img src="images/vtv3.png" alt="VTV3">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV4', 'https://vtv4-hlsv4.vtv.vn/vtv4.m3u8', 'vtv4')">
                    <img src="images/vtv4.png" alt="VTV4">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5', 'https://vtv5-hlsv4.vtv.vn/vtv5.m3u8', 'vtv5')">
                    <img src="images/vtv5.png" alt="VTV5">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5 Tây Nam Bộ', 'https://vtv5tnb-hlsv4.vtv.vn/vtv5tnb.m3u8', 'vtv5tnb')">
                    <img src="images/vtv5tnb.png" alt="VTV5 TNB">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV5 Tây Nguyên', 'https://vtv5tn-hlsv4.vtv.vn/vtv5tn.m3u8', 'vtv5tn')">
                    <img src="images/vtv5tn.png" alt="VTV5 TN">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV7', 'https://vtv7-hlsv4.vtv.vn/vtv7.m3u8', 'vtv7')">
                    <img src="images/vtv7.png" alt="VTV7">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV8', 'https://vtv8-hlsv4.vtv.vn/vtv8.m3u8', 'vtv8')">
                    <img src="images/vtv8.png" alt="VTV8">
                </button>
                <button class="channel-btn" onclick="playChannel('VTV9', 'https://vtv9-hlsv4.vtv.vn/vtv9.m3u8', 'vtv9')">
                    <img src="images/vtv9.png" alt="VTV9">
                </button>
            </div>

            <!-- NHÓM HTV -->
            <div class="group-title-logo">
                <img src="images/htv.png" alt="HTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('HTV1', 'https://liveh12byt.vtvprime.vn/hls/HTV1/03.m3u8', 'htv1')">
                    <img src="images/htv1.png" alt="HTV1">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV2', 'https://liveh12byt.vtvprime.vn/hls/HTV2/03.m3u8', 'htv2')">
                    <img src="images/htv2.png" alt="HTV2">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV3', 'https://liveh12byt.vtvprime.vn/hls/HTV3/03.m3u8', 'htv3')">
                    <img src="images/htv3.png" alt="HTV3">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV4', 'https://liveh12byt.vtvprime.vn/hls/HTV4/03.m3u8', 'htv4')">
                    <img src="images/htv4.png" alt="HTV4">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV7', 'https://liveh12byt.vtvprime.vn/hls/HTV7/03.m3u8', 'htv7')">
                    <img src="images/htv7.png" alt="HTV7">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV9', 'https://liveh12byt.vtvprime.vn/hls/HTV9/03.m3u8', 'htv9')">
                    <img src="images/htv9.png" alt="HTV9">
                </button>
                <button class="channel-btn" onclick="playChannel('HTV Thể Thao', 'https://liveh12byt.vtvprime.vn/hls/HTVTT/03.m3u8', 'htvtt')">
                    <img src="images/htvtt.png" alt="HTV Thể Thao">
                </button>
            </div>

            <!-- NHÓM ON SPORTS / VTVcab -->
            <div class="group-title-logo">
                <img src="images/onsports.png" alt="ON Sports" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('ON Sports', 'https://liveh12byt.vtvprime.vn/hls/ONSPORTS/03.m3u8', 'onsports')">
                    <img src="images/onsports.png" alt="ON Sports">
                </button>
                <button class="channel-btn" onclick="playChannel('ON Sports+', 'https://liveh12byt.vtvprime.vn/hls/ONSPORTSPLUS/03.m3u8', 'onsportsplus')">
                    <img src="images/onsportsplus.png" alt="ON Sports+">
                </button>
                <button class="channel-btn" onclick="playChannel('ON Football', 'https://liveh12byt.vtvprime.vn/hls/ONFOOTBALL/03.m3u8', 'onfootball')">
                    <img src="images/onfootball.png" alt="ON Football">
                </button>
                <button class="channel-btn" onclick="playChannel('ON Sports News', 'https://liveh12byt.vtvprime.vn/hls/ONSPORTSNEWS/03.m3u8', 'onsportsnews')">
                    <img src="images/onsportsnews.png" alt="ON Sports News">
                </button>
            </div>

            <!-- NHÓM SCTV -->
            <div class="group-title-logo">
                <img src="images/sctv.png" alt="SCTV" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('SCTV 15 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV15/03.m3u8', 'sctv15')">
                    <img src="images/sctv15.png" alt="SCTV 15">
                </button>
                <button class="channel-btn" onclick="playChannel('SCTV 17 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV17/03.m3u8', 'sctv17')">
                    <img src="images/sctv17.png" alt="SCTV 17">
                </button>
                <button class="channel-btn" onclick="playChannel('SCTV 22 (Sports)', 'https://liveh12byt.vtvprime.vn/hls/SCTV22/03.m3u8', 'sctv22')">
                    <img src="images/sctv22.png" alt="SCTV 22">
                </button>
            </div>

            <!-- NHÓM THVL -->
            <div class="group-title-logo">
                <img src="images/thvl.png" alt="THVL" class="station-logo-big">
            </div>
            <div class="channel-grid">
                <button class="channel-btn" onclick="playChannel('THVL 1', 'https://liveh12byt.vtvprime.vn/hls/THVL1/03.m3u8', 'thvl1')">
                    <img src="images/thvl1.png" alt="THVL 1">
                </button>
                <button class="channel-btn" onclick="playChannel('THVL 2', 'https://liveh12byt.vtvprime.vn/hls/THVL2/03.m3u8', 'thvl2')">
                    <img src="images/thvl2.png" alt="THVL 2">
                </button>
                <button class="channel-btn" onclick="playChannel('THVL 3', 'https://liveh12byt.vtvprime.vn/hls/THVL3/03.m3u8', 'thvl3')">
                    <img src="images/thvl3.png" alt="THVL 3">
                </button>
                <button class="channel-btn" onclick="playChannel('THVL 4', 'https://liveh12byt.vtvprime.vn/hls/THVL4/03.m3u8', 'thvl4')">
                    <img src="images/thvl4.png" alt="THVL 4">
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
